<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Image Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="left">
                <div class="top">

                    <!-- <label for ="hiiii">hi
                        <input id="hiiii" type="file" hidden>
                    </label> -->

                    <label for="image-input" class="btn">Choose Image</label>
                    <input type="file" id="image-input" hidden>
                    <button class="btn" id="reset-btn">Reset</button>
                    <button class="btn" id="download-btn">Download</button>
                </div>
                <div class="bottom">
                    <div class="placeholder" id="placeholder">
                        <i class="ri-image-line"></i>
                        <p>No Image Chosen</p>
                    </div>
                    <canvas id="image-canvas" style="display: none;"></canvas>
                </div>
            </div>
            <div class="right">
                <h2>Filters</h2>
                <div class="filters" id="filters-container"></div>
                
                <h2>Presets</h2>
                <div class="presets" id="presets-container"></div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
